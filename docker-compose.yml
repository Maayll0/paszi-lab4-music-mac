services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-musicaccess}
      POSTGRES_DB: ${POSTGRES_DB:-musicaccess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-musicaccess}
      POSTGRES_DB: ${POSTGRES_DB:-musicaccess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py first}
      APP_ENV: ${APP_ENV:-development}
      HASH_SCHEME: ${HASH_SCHEME:-argon2id}
      SECRET_KEY: ${SECRET_KEY:-}
      PORT: 8000
      ARGON2_TIME_COST: ${ARGON2_TIME_COST:-3}
      ARGON2_MEMORY_COST: ${ARGON2_MEMORY_COST:-65536}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-2}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      DEMO_PUBLIC_PASSWORD: ${DEMO_PUBLIC_PASSWORD:-}
      DEMO_CONFIDENTIAL_PASSWORD: ${DEMO_CONFIDENTIAL_PASSWORD:-}
      DEMO_SECRET_PASSWORD: ${DEMO_SECRET_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - audio_data:/app/backend/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  audio_data:
